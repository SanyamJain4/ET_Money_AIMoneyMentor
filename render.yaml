# Render Blueprint: deploys backend (web service) + frontend (static site), both free tier.
# Dashboard: New + > Blueprint > pick this repo. Then set the two values marked sync:false.
services:
  - type: web
    name: ai-money-mentor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste your key in the Render dashboard, never in git
      - key: CORS_ORIGINS
        sync: false          # your frontend URL, e.g. https://ai-money-mentor.onrender.com
      - key: LLM_MODEL
        value: gemini-3.8-flash
  - type: web
    name: ai-money-mentor
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # your backend URL, e.g. https://ai-money-mentor-api.onrender.com
